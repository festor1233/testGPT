[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-miner"
version = "0.1.0"
description = "A beautiful Minesweeper project where a tiny neural network learns to play."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "festor1233"}]
keywords = ["minesweeper", "ai", "neural-network", "reinforcement-learning", "python"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment :: Puzzle Games",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
neuro-miner-train = "neuro_miner.train:main"
neuro-miner-play = "neuro_miner.play:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
